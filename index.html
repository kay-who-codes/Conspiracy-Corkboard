<title>Conspiracy Corkboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column. Hand of six case-file cards on top, a pin-to-board overlay with red string below it. */
:root{
  --bg:#15120f; --panel:#1f1a15; --panel2:#2a231c; --line:#3a3027;
  --text:#efe6d8; --muted:#a39785; --string:#e5483f; --paper:#f1e9d6; --ink:#1d1812;
  --cork:#3a2b1d; --cork2:#2f2318;
  --c-person:#7fb2ff; --c-object:#6fd6a8; --c-event:#ff9a6b;
  color-scheme:dark;
  --mono:ui-monospace,"SF Mono","Courier New",Courier,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:auto}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:16px; line-height:1.4;
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
header{text-align:center}
h1{margin:0; font-family:var(--mono); font-size:1.35rem; letter-spacing:.14em; text-transform:uppercase; text-wrap:balance}
h1 span{color:var(--string)}
.sub{margin:6px 0 0; color:var(--muted); font-size:.85rem}
.count{margin:4px 0 0; color:#6c6254; font-size:.7rem; font-family:var(--mono); letter-spacing:.05em}
.hint{font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; gap:8px}
.hand{display:flex; flex-direction:column; gap:10px}
.card{
  position:relative; display:flex; align-items:center; gap:12px; text-align:left; width:100%;
  background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--cat); border-radius:6px;
  padding:14px 14px 14px 12px; color:var(--text); font:inherit; cursor:pointer; min-height:62px;
  -webkit-tap-highlight-color:transparent;
}
.card:focus-visible{outline:2px solid var(--text); outline-offset:2px}
.card.sel{background:var(--panel2); border-color:var(--cat); box-shadow:0 0 0 1px var(--cat) inset}
.tag{font-family:var(--mono); font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:var(--cat); width:52px; flex:none}
.card .txt{flex:1; min-width:0; font-size:1.05rem; font-weight:600; overflow-wrap:anywhere}
.card input{
  flex:1; min-width:0; background:transparent; border:0; border-bottom:1px dashed var(--muted); color:var(--text);
  font:inherit; font-size:1.05rem; font-weight:600; padding:2px 0; outline:none;
}
.card input:focus{border-bottom-color:var(--text)}
.badge{
  flex:none; width:26px; height:26px; border-radius:50%; background:var(--cat); color:var(--ink);
  font-family:var(--mono); font-weight:700; font-size:.85rem; display:grid; place-items:center; visibility:hidden;
}
.card.sel .badge{visibility:visible}
.person{--cat:var(--c-person)} .object{--cat:var(--c-object)} .event{--cat:var(--c-event)}
.actions{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.btn{
  border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:8px; padding:14px 12px;
  font:inherit; font-weight:600; cursor:pointer; min-height:50px;
}
.btn.main{grid-column:1/-1; background:var(--string); border-color:var(--string); color:#fff; font-size:1.05rem}
.btn:disabled{opacity:.35; cursor:default}
.btn:focus-visible{outline:2px solid var(--text); outline-offset:2px}
.note{margin:0; color:var(--muted); font-size:.8rem; text-align:center}

/* board overlay */
.board-wrap{
  position:fixed; inset:0; z-index:50; overflow-y:auto; overscroll-behavior:contain;
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.04) 0 2px, transparent 3px) 0 0/34px 34px,
    radial-gradient(circle at 70% 60%, rgba(0,0,0,.18) 0 2px, transparent 3px) 0 0/27px 27px,
    linear-gradient(160deg,var(--cork),var(--cork2));
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.board{position:relative; max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:34px; padding:56px 0 20px}
.board svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:2}
.board path{fill:none; stroke:var(--string); stroke-width:3; stroke-linecap:round; filter:drop-shadow(0 2px 1px rgba(0,0,0,.5))}
.board-top{position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; z-index:3}
.board-top .label{font-family:var(--mono); font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:#d8c7aa}
.round{
  width:44px; height:44px; border-radius:50%; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.2);
  color:var(--text); font:inherit; font-size:1.1rem; cursor:pointer;
}
.round:focus-visible,.timer:focus-visible{outline:2px solid var(--text); outline-offset:2px}
.pcard{
  position:relative; z-index:1; background:var(--paper); color:var(--ink); padding:18px 18px 22px; border-radius:3px;
  box-shadow:0 10px 20px rgba(0,0,0,.45); width:84%; transform:rotate(var(--rot));
}
.pcard:nth-child(odd){align-self:flex-start} .pcard:nth-child(even){align-self:flex-end}
.pin{position:absolute; top:-7px; left:50%; width:16px; height:16px; margin-left:-8px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff8f86,#b3261e 70%); box-shadow:0 3px 4px rgba(0,0,0,.5); z-index:3}
.pcard .kind{font-family:var(--mono); font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:#7a6a52}
.pcard .big{margin-top:6px; font-family:var(--mono); font-weight:700; font-size:1.55rem; line-height:1.15; overflow-wrap:anywhere; text-wrap:balance}
.pcard .stamp{margin-top:10px; height:3px; width:46px; background:var(--cat)}
.board-foot{display:flex; justify-content:center; align-items:center; gap:12px; margin-top:6px; position:relative; z-index:3}
.timer{
  background:rgba(0,0,0,.5); color:var(--text); border:1px solid rgba(255,255,255,.2); border-radius:999px;
  padding:10px 18px; font-family:var(--mono); font-size:.95rem; cursor:pointer; font-variant-numeric:tabular-nums; min-height:44px;
}
.timer.low{color:#ff8e86; border-color:#ff8e86}
.say{font-family:var(--mono); font-size:.75rem; color:#d8c7aa; text-align:center; letter-spacing:.06em; margin:0}
@media (prefers-reduced-motion:no-preference){
  .board path{stroke-dasharray:var(--len); stroke-dashoffset:var(--len); animation:draw .7s ease-out forwards}
  .board path:nth-of-type(2){animation-delay:.5s}
  .pcard{animation:drop .35s ease-out both} .pcard:nth-child(2){animation-delay:.12s} .pcard:nth-child(3){animation-delay:.24s}
}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes drop{from{opacity:0;transform:translateY(-14px) rotate(var(--rot))}}
</style>
</head>

<div class="wrap">
  <header>
    <h1>Conspiracy <span>Corkboard</span></h1>
    <p class="sub">Draw six. Pin three. Connect the dots.</p>
    <p class="count" id="count"></p>
  </header>

  <div class="hint"><span>Your hand</span><span id="selCount">0/3 picked</span></div>
  <div class="hand" id="hand"></div>

  <div class="actions">
    <button class="btn main" id="pinBtn" type="button">Pin to corkboard</button>
    <button class="btn" id="redrawBtn" type="button">Redraw picked</button>
    <button class="btn" id="newBtn" type="button">New hand</button>
  </div>
  <p class="note">Pick any three cards in the order you want them linked. Turns and scoring happen at the table.</p>
</div>

<div class="board-wrap" id="boardWrap" hidden>
  <div class="board" id="board">
    <div class="board-top">
      <span class="label">Case file</span>
      <button class="round" id="closeBtn" type="button" aria-label="Close corkboard">✕</button>
    </div>
    <svg id="strings" aria-hidden="true"></svg>
    <div id="pcards" style="display:contents"></div>
    <div class="board-foot">
      <button class="timer" id="timer" type="button">⏱ 20s pitch</button>
    </div>
    <p class="say">Explain how they are connected.</p>
  </div>
</div>

var LABEL = {person:"Person", object:"Object", event:"Event"};
var BLANK_CHANCE = 0.10; // any draw has a 1-in-10 chance of being a write-your-own card
var HAND_PER_KIND = 2;

function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function stripArticle(t){ return /^(A |The )/.test(t) && Math.random()<0.5 ? t.replace(/^(A |The )/,"") : t; }

var decks = {};
function buildDeck(kind){
  var d = KINDS[kind].map(function(t){ return {kind:kind, text:stripArticle(t), blank:false}; });
  return shuffle(d);
}
function draw(kind){
  if(Math.random() < BLANK_CHANCE) return {kind:kind, text:"", blank:true};
  if(!decks[kind] || !decks[kind].length) decks[kind] = buildDeck(kind);
  return decks[kind].pop();
}

  hand = [];
  ["person","object","event"].forEach(function(k){ for(var i=0;i<HAND_PER_KIND;i++) hand.push(draw(k)); });
  shuffle(hand);
  picked = [];
  render();
}
function redrawPicked(){
  if(!picked.length) return;
  picked.forEach(function(idx){ hand[idx] = draw(hand[idx].kind); });
  picked = [];
  render();
}
function toggle(i){
  var p = picked.indexOf(i);
  if(p>-1) picked.splice(p,1); else if(picked.length<3) picked.push(i);
  render();
}

function render(){
  var el = document.getElementById("hand");
  el.textContent = "";
  hand.forEach(function(c,i){
    var pos = picked.indexOf(i);
    var b = document.createElement("div");
    b.className = "card " + c.kind + (pos>-1 ? " sel" : "");
    b.setAttribute("role","button"); b.tabIndex = 0;
    b.setAttribute("aria-pressed", pos>-1 ? "true" : "false");
    var tag = document.createElement("span"); tag.className="tag"; tag.textContent = LABEL[c.kind];
    b.appendChild(tag);
    if(c.blank){
      var inp = document.createElement("input");
      inp.type="text"; inp.placeholder="Write your own…"; inp.value=c.text; inp.maxLength=40;
      inp.id = "blank-" + i + "-" + Math.random().toString(36).slice(2,6);
      inp.setAttribute("aria-label","Write your own " + LABEL[c.kind].toLowerCase());
      inp.addEventListener("input", function(){ c.text = inp.value; });
      inp.addEventListener("click", function(e){ e.stopPropagation(); });
      inp.addEventListener("keydown", function(e){ e.stopPropagation(); });
      b.appendChild(inp);
    } else {
      var t = document.createElement("span"); t.className="txt"; t.textContent = c.text; b.appendChild(t);
    }
    var bd = document.createElement("span"); bd.className="badge"; bd.textContent = pos>-1 ? String(pos+1) : ""; b.appendChild(bd);
    b.addEventListener("click", function(){ toggle(i); });
    b.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(i); } });
    el.appendChild(b);
  });
  document.getElementById("selCount").textContent = picked.length + "/3 picked";
  document.getElementById("pinBtn").disabled = picked.length!==3;
  document.getElementById("redrawBtn").disabled = picked.length===0;
}

/* board */
var timerId = null;
function openBoard(){
  if(picked.length!==3) return;
  var holder = document.getElementById("pcards");
  holder.textContent = "";
  var rots = [-2.2, 1.8, -1.4];
  picked.forEach(function(idx,n){
    var c = hand[idx];
    var d = document.createElement("div");
    d.className = "pcard " + c.kind;
    d.style.setProperty("--rot", rots[n]+"deg");
    d.style.setProperty("--cat", "var(--c-"+c.kind+")");
    var pin = document.createElement("span"); pin.className="pin";
    var k = document.createElement("div"); k.className="kind"; k.textContent = LABEL[c.kind];
    var big = document.createElement("div"); big.className="big"; big.textContent = c.text.trim() || "???";
    var st = document.createElement("div"); st.className="stamp";
    d.appendChild(pin); d.appendChild(k); d.appendChild(big); d.appendChild(st);
    holder.appendChild(d);
  });
  document.getElementById("boardWrap").hidden = false;
  document.getElementById("boardWrap").scrollTop = 0;
  resetTimer();
  requestAnimationFrame(function(){ requestAnimationFrame(drawStrings); });
}
function drawStrings(){
  var board = document.getElementById("board");
  var svg = document.getElementById("strings");
  var pins = board.querySelectorAll(".pin");
  var br = board.getBoundingClientRect();
  svg.setAttribute("viewBox","0 0 "+br.width+" "+br.height);
  svg.textContent = "";
  var pts = [];
  pins.forEach(function(p){ var r = p.getBoundingClientRect(); pts.push([r.left - br.left + r.width/2, r.top - br.top + r.height/2]); });
  for(var i=0;i<pts.length-1;i++){
    var a = pts[i], b = pts[i+1];
    var midx = (a[0]+b[0])/2, midy = (a[1]+b[1])/2 + 26;
    var path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d","M"+a[0]+" "+a[1]+" Q"+midx+" "+midy+" "+b[0]+" "+b[1]);
    svg.appendChild(path);
    var len = Math.ceil(path.getTotalLength());
    path.style.setProperty("--len", len);
  }
}
function closeBoard(){ document.getElementById("boardWrap").hidden = true; resetTimer(); }

function resetTimer(){
  if(timerId){ clearInterval(timerId); timerId = null; }
  var t = document.getElementById("timer");
  t.textContent = "⏱ 20s pitch"; t.classList.remove("low");
}
function toggleTimer(){
  var t = document.getElementById("timer");
  if(timerId){ resetTimer(); return; }
  var left = 20;
  t.textContent = "⏱ " + left + "s";
  timerId = setInterval(function(){
    left--;
    t.textContent = left>0 ? "⏱ " + left + "s" : "Time's up";
    if(left<=5) t.classList.add("low");
    if(left<=0){ clearInterval(timerId); timerId = null; try{ if(navigator.vibrate) navigator.vibrate(200); }catch(e){} }
  },1000);
}

document.getElementById("pinBtn").addEventListener("click", openBoard);
document.getElementById("redrawBtn").addEventListener("click", redrawPicked);
document.getElementById("newBtn").addEventListener("click", newHand);
document.getElementById("closeBtn").addEventListener("click", closeBoard);
document.getElementById("timer").addEventListener("click", toggleTimer);
window.addEventListener("resize", function(){ if(!document.getElementById("boardWrap").hidden) drawStrings(); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !document.getElementById("boardWrap").hidden) closeBoard(); });

(function(){
  var uniq = 0; for(var k in KINDS) uniq += KINDS[k].length;
  
  document.getElementById("count").textContent = uniq + " written cards · 1 in 10 draws is a blank";
})();
newHand();
</script>
